[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dlkit"
version = "0.2.0"
description = "Reusable epoch-based PyTorch training toolkit plus framework-agnostic model artifact/serving contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.11,<3"]
callbacks-rich = ["rich>=13"]
callbacks-optuna = ["optuna>=4"]
plotting = ["matplotlib>=3.8"]
# Self-referential extra: pyproject.toml is declarative data, not a template
# language, so this list of extra names has to be kept in sync by hand
# whenever a new extra is added above.
all = ["dlkit[mlflow,callbacks-rich,callbacks-optuna,plotting]"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dlkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["src"]

[tool.coverage.run]
source = ["dlkit"]
