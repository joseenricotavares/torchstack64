name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/version-check
        with:
          package-name: dlkit
          package-dir: .
          base-sha: ${{ github.event.pull_request.base.sha }}
          also: ""

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Type check
        run: |
          source .venv/bin/activate
          mypy src/dlkit

      - name: Test with coverage
        run: |
          source .venv/bin/activate
          pytest --cov=dlkit --cov-report=term-missing --cov-fail-under=80

  # What a wheel actually ships: `pip install -e .` reads everything straight from src/.
  library-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install as a library (no editable install, no extras)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install .

      - name: The installed package imports
        run: |
          source .venv/bin/activate
          cd "$(mktemp -d)"
          python -c "import dlkit; print(dlkit.__version__)"

  tag-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [test, library-install]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: ./.github/actions/tag-package
        with:
          package-dir: .
